<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title id="t">La méthode en 4 étapes pour automatiser</title><desc id="d">Quatre étapes : cartographier les tâches répétitives, choisir une première cible, mettre en place et mesurer, puis étendre progressivement.</desc>
<rect width="1200" height="450" fill="#FAFAF8"/><rect x=".5" y=".5" width="1199" height="449" fill="none" stroke="#ECECEC"/>
<text x="60" y="70" font-size="32" font-weight="700" fill="#111" text-anchor="start">Automatiser en 4 étapes</text><text x="60" y="105" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">De la liste des tâches à la généralisation.</text><rect x="60.0" y="170" width="247.5" height="230" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><circle cx="104.0" cy="220" r="24" fill="#FF6B1A"/><text x="104.0" y="228" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">1</text><g transform="translate(237.5 200) scale(1.6666666666666667)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></g><text x="84.0" y="295" font-size="22" font-weight="700" fill="#111" text-anchor="start">Cartographier</text><text x="84.0" y="340" font-size="16" font-weight="400" fill="#555" text-anchor="start">lister les tâches</text><text x="84.0" y="368" font-size="16" font-weight="400" fill="#555" text-anchor="start">répétitives</text><path d="M311.5 285 L333.5 285" stroke="#FF6B1A" stroke-width="2.5"/><path d="M322.7 290.2 L333.5 285 L322.7 279.8" fill="none" stroke="#FF6B1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="337.5" y="170" width="247.5" height="230" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><circle cx="381.5" cy="220" r="24" fill="#FF6B1A"/><text x="381.5" y="228" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">2</text><g transform="translate(515.0 200) scale(1.6666666666666667)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g><text x="361.5" y="295" font-size="22" font-weight="700" fill="#111" text-anchor="start">Choisir</text><text x="361.5" y="340" font-size="16" font-weight="400" fill="#555" text-anchor="start">une première cible</text><text x="361.5" y="368" font-size="16" font-weight="400" fill="#555" text-anchor="start">simple et fréquente</text><path d="M589.0 285 L611.0 285" stroke="#FF6B1A" stroke-width="2.5"/><path d="M600.2 290.2 L611.0 285 L600.2 279.8" fill="none" stroke="#FF6B1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="615.0" y="170" width="247.5" height="230" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><circle cx="659.0" cy="220" r="24" fill="#FF6B1A"/><text x="659.0" y="228" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">3</text><g transform="translate(792.5 200) scale(1.6666666666666667)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></g><text x="639.0" y="295" font-size="22" font-weight="700" fill="#111" text-anchor="start">Mettre en place</text><text x="639.0" y="340" font-size="16" font-weight="400" fill="#555" text-anchor="start">automatiser et</text><text x="639.0" y="368" font-size="16" font-weight="400" fill="#555" text-anchor="start">mesurer le gain</text><path d="M866.5 285 L888.5 285" stroke="#FF6B1A" stroke-width="2.5"/><path d="M877.7 290.2 L888.5 285 L877.7 279.8" fill="none" stroke="#FF6B1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="892.5" y="170" width="247.5" height="230" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><circle cx="936.5" cy="220" r="24" fill="#FF6B1A"/><text x="936.5" y="228" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">4</text><g transform="translate(1070.0 200) scale(1.6666666666666667)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></g><tex