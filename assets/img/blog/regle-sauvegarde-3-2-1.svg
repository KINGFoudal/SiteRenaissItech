<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title id="t">La règle de sauvegarde 3-2-1</title><desc id="d">Trois copies des données, sur deux supports différents, dont une copie hors site, avec un test de restauration régulier.</desc>
<rect width="1200" height="675" fill="#FAFAF8"/><rect x=".5" y=".5" width="1199" height="674" fill="none" stroke="#ECECEC"/>
<text x="60" y="70" font-size="32" font-weight="700" fill="#111" text-anchor="start">La règle de sauvegarde 3-2-1</text><text x="60" y="105" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">La méthode recommandée pour repartir vite après un incident.</text><rect x="60" y="170" width="340" height="330" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><text x="100" y="290" font-size="110" font-weight="800" fill="#FF6B1A" text-anchor="start">3</text><g transform="translate(310 200) scale(2.3333333333333335)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7Z"/><path d="M15 2v5h5"/><path d="M4 6v14a2 2 0 0 0 2 2h10"/></g><text x="100" y="350" font-size="22" font-weight="700" fill="#111" text-anchor="start">copies de vos données</text><text x="100" y="390" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">l’original et deux sauvegardes</text><rect x="430" y="170" width="340" height="330" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><text x="470" y="290" font-size="110" font-weight="800" fill="#FF6B1A" text-anchor="start">2</text><g transform="translate(680 200) scale(2.3333333333333335)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></g><text x="470" y="350" font-size="22" font-weight="700" fill="#111" text-anchor="start">supports différents</text><text x="470" y="390" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">par exemple un disque et</text><text x="470" y="416" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">un stockage cloud</text><rect x="800" y="170" width="340" height="330" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><text x="840" y="290" font-size="110" font-weight="800" fill="#FF6B1A" text-anchor="start">1</text><g transform="translate(1050 200) scale(2.3333333333333335)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10Z"/></g><text x="840" y="350" font-size="22" font-weight="700" fill="#111" text-anchor="start">copie hors site</text><text x="840" y="390" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">à l’abri d’un sinistre</text><text x="840" y="416" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">ou d’un rançongiciel</text><rect x="60" y="540" width="1080" height="70" rx="14" fill="#FFF1E8" stroke="#FFC9A8" stroke-width="1.5"/><g transform="translate(90 562) scale(1.1666666666666667)" fill="none" stroke="#FF6B1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-5"/></g><text x="135" y="583" font-size="19" font-weight="600" fill="#9A3412" text-anchor="start">Et testez la restauration au moins une fois par trimestre.</text>
</svg>
