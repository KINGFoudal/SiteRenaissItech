<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title id="t">Schéma des 5 couches de protection d’un site web</title><desc id="d">Cinq cercles concentriques protègent les données du site : mises à jour, HTTPS, gestion des accès, sauvegardes et surveillance.</desc>
<rect width="1200" height="675" fill="#FAFAF8"/><rect x=".5" y=".5" width="1199" height="674" fill="none" stroke="#ECECEC"/>
<text x="60" y="70" font-size="32" font-weight="700" fill="#111" text-anchor="start">Les 5 couches de protection d’un site web</text><circle cx="330" cy="380" r="250" fill="#FF6B1A" fill-opacity="0.08" stroke="#FF6B1A" stroke-opacity=".5"/><text x="330" y="160" font-size="18" font-weight="700" fill="#C2410C" text-anchor="middle">1</text><circle cx="330" cy="380" r="205" fill="#FF6B1A" fill-opacity="0.17" stroke="#FF6B1A" stroke-opacity=".5"/><text x="330" y="205" font-size="18" font-weight="700" fill="#C2410C" text-anchor="middle">2</text><circle cx="330" cy="380" r="160" fill="#FF6B1A" fill-opacity="0.26" stroke="#FF6B1A" stroke-opacity=".5"/><text x="330" y="250" font-size="18" font-weight="700" fill="#C2410C" text-anchor="middle">3</text><circle cx="330" cy="380" r="115" fill="#FF6B1A" fill-opacity="0.35" stroke="#FF6B1A" stroke-opacity=".5"/><text x="330" y="295" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="330" cy="380" r="70" fill="#FF6B1A" fill-opacity="0.44" stroke="#FF6B1A" stroke-opacity=".5"/><text x="330" y="340" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text><g transform="translate(298 340) scale(2.7)"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" fill="#fff"/></g><text x="330" y="436" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Vos données</text><rect x="660" y="150" width="480" height="80" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><circle cx="700" cy="190" r="20" fill="#FF6B1A"/><text x="700" y="197" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><g transform="translate(735 176) scale(1.1666666666666667)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></g><text x="780" y="186" font-size="20" font-weight="700" fill="#111" text-anchor="start">Mises à jour</text><text x="780" y="212" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">CMS, extensions, bibliothèques</text><rect x="660" y="246" width="480" height="80" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><circle cx="700" cy="286" r="20" fill="#FF6B1A"/><text x="700" y="293" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><g transform="translate(735 272) scale(1.1666666666666667)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g><text x="780" y="282" font-size="20" font-weight="700" fill="#111" text-anchor="start">HTTPS</text><text x="780" y="308" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">échanges chiffrés</text><rect x="660" y="342" width="480" height="80" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><circle cx="700" cy="382" r="20" fill="#FF6B1A"/><text x="700" y="389" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><g transform="translate(735 368) scale(1.1666666666666667)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></g><text x="780" y="378" font-size="20" font-weight="700" fill="#111" text-anchor="start">Accès</text><text x="780" y="404" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">mots de passe uniques, double authentification</text><rect x="660" y="438" width="480" height="80" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><circle cx="700" cy="478" r="20" fill="#FF6B1A"/><text x="700" y="485" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><g transform="translate(735 464) scale(1.1666666666666667)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></g><text x="780" y="474" font-size="20" font-weight="700" fill="#111" text-anchor="start">Sauvegardes</text><text x="780" y="500" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">hors serveur, restauration testée</text><rect x="660" y="534" width="480" height="80" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><circle cx="700" cy="574" r="20" fill="#FF6B1A"/><text x="700" y="581" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text><g transform="translate(735 560) scale(1.1666666666666667)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></g><text x="780" y="570" font-size="20" font-weight="700" fill="#111" text-anchor="start">Surveillance</text><text x="780" y="596" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">alertes et procédure d’incident</text>
</svg>
