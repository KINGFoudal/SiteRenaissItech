 font-weight="400" fill="#555" text-anchor="start">un prototype sur vos</text><text x="361.5" y="368" font-size="16" font-weight="400" fill="#555" text-anchor="start">vraies données</text><path d="M589.0 285 L611.0 285" stroke="#FF6B1A" stroke-width="2.5"/><path d="M600.2 290.2 L611.0 285 L600.2 279.8" fill="none" stroke="#FF6B1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="615.0" y="170" width="247.5" height="230" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><circle cx="659.0" cy="220" r="24" fill="#FF6B1A"/><text x="659.0" y="228" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">3</text><g transform="translate(792.5 200) scale(1.6666666666666667)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/><path d="m7 9 5-4 5 3 4-3"/></g><text x="639.0" y="295" font-size="22" font-weight="700" fill="#111" text-anchor="start">Mesure</text><text x="639.0" y="340" font-size="16" font-weight="400" fill="#555" text-anchor="start">temps gagné, qualité,</text><text x="639.0" y="368" font-size="16" font-weight="400" fill="#555" text-anchor="start">retours des équipes</text><path d="M866.5 285 L888.5 285" stroke="#FF6B1A" stroke-width="2.5"/><path d="M877.7 290.2 L888.5 285 L877.7 279.8" fill="none" stroke="#FF6B1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="892.5" y="170" width="247.5" height="230" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><circle cx="936.5" cy="220" r="24" fill="#FF6B1A"/><text x="936.5" y="228" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">4</text><g transform="translate(1070.0 200) scale(1.6666666666666667)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></g><text x="916.5" y="295" font-size="22" font-weight="700" fill="#111" text-anchor="start">Déploiement</text><text x="916.5" y="340" font-size="16" font-weight="400" fill="#555" text-anchor="start">mise en production</text><text x="916.5" y="368" font-size="16" font-weight="400" fill="#555" text-anchor="start">et formation</text>
