<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title id="t">Les 4 étapes pour démarrer un projet IA</title><desc id="d">Quatre étapes : choisir un cas d’usage précis, tester avec un PoC sur de vraies données, mesurer les gains, puis déployer et former les équipes.</desc>
