<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title id="t">Matrice pour choisir la première tâche à automatiser</title><desc id="d">Matrice à quatre cases croisant la fréquence d’une tâche et la simplicité de son automatisation : les tâches fréquentes et simples sont la priorité numéro un, les tâches rares et complexes sont à éviter.</desc>
<rect width="1200" height="675" fill="#FAFAF8"/><rect x=".5" y=".5" width="1199" height="674" fill="none" stroke="#ECECEC"/>
<text x="60" y="70" font-size="32" font-weight="700" fill="#111" text-anchor="start">Quelle tâche automatiser en premier ?</text><text x="60" y="105" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">Croisez la fréquence de la tâche et la simplicité de son automatisation.</text><rect x="300.0" y="135" width="287.0" height="205" rx="14" fill="#FFF1E8" stroke="#FF6B1A" stroke-width="2"/><text x="443.5" y="227.5" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Priorité n° 1</text><text x="443.5" y="259.5" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">fréquente et simple :</text><text x="443.5" y="283.5" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">gain rapide</text><rect x="597.0" y="135" width="287.0" height="205" rx="14" fill="#F7F7F8" stroke="#999" stroke-width="2"/><text x="740.5" y="227.5" font-size="22" font-weight="700" fill="#444" text-anchor="middle">À planifier</text><text x="740.5" y="259.5" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">fréquente mais complexe :</text><text x="740.5" y="283.5" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">projet dédié</text><rect x="300.0" y="350" width="287.0" height="205" rx="14" fill="#F7F7F8" stroke="#999" stroke-width="2"/><text x="443.5" y="442.5" font-size="22" font-weight="700" fill="#444" text-anchor="middle">Si le temps le permet</text><text x="443.5" y="474.5" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">rare mais simple</text><rect x="597.0" y="350" width="287.0" height="205" rx="14" fill="#fff" stroke="#CCC" stroke-width="2"/><text x="740.5" y="442.5" font-size="22" font-weight="700" fill="#444" text-anchor="middle">À éviter</text><text x="740.5" y="474.5" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">rare et complexe</text><path d="M270 555 L270 135" stroke="#333" stroke-width="2.5"/><path d="M275.2 145.8 L270 135 L264.8 145.8" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="345" font-size="17" font-weight="600" fill="#333" text-anchor="middle" transform="rotate(-90 240 345)">Fréquence</text><text x="250" y="155" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="end">haute</text><text x="250" y="545" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="end">basse</text><path d="M300 585 L884.0 585" stroke="#333" stroke-width="2.5"/><path d="M873.2 590.2 L884.0 585 L873.2 579.8" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="592.0" y="615" font-size="17" font-weight="600" fill="#333" text-anchor="middle">Simplicité d’automatisation</text><text x="300" y="615" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="start">simple</text><text x="884.0" y="615" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="end">complexe</text>
</svg>
