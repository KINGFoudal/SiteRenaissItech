<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title id="t">Schéma : IA publique ou IA privée, le trajet de vos données</title><desc id="d">Avec une IA publique, la question et les documents du collaborateur partent vers les serveurs d’un tiers, avec des risques de fuite et de non-conformité. Avec une IA privée, le modèle et les documents restent dans le périmètre de l’entreprise et la réponse est sourcée.</desc>
<rect width="1200" height="675" fill="#FAFAF8"/><rect x=".5" y=".5" width="1199" height="674" fill="none" stroke="#ECECEC"/>
<text x="60" y="70" font-size="32" font-weight="700" fill="#111" text-anchor="start">IA publique ou IA privée : le trajet de vos données</text><text x="60" y="130" font-size="20" font-weight="700" fill="#DC2626" text-anchor="start">IA publique (chatbot grand public)</text><rect x="60" y="160" width="220" height="150" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><g transform="translate(145 185) scale(1.3333333333333333)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></g><text x="170" y="260" font-size="18" font-weight="600" fill="#333" text-anchor="middle">Collaborateur</text><text x="170" y="285" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="middle">pose une question</text><rect x="430" y="160" width="300" height="150" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/><g transform="translate(555 182) scale(1.4166666666666667)" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10Z"/></g><text x="580" y="255" font-size="18" font-weight="700" fill="#991B1B" text-anchor="middle">Serveurs d’un tiers</text><text x="580" y="280" font-size="14" font-weight="400" fill="#991B1B" text-anchor="middle">hors de l’UE, conditions changeantes</text><path d="M285 220 L425 220" stroke="#DC2626" stroke-width="2.5"/><path d="M414.2 225.2 L425 220 L414.2 214.8" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="355" y="208" font-size="13" font-weight="600" fill="#DC2626" text-anchor="middle">contrat, fichier client</text><rect x="860" y="180" width="280" height="110" rx="14" fill="#fff" stroke="#FCA5A5" stroke-width="1.5"/><text x="1000" y="222" font-size="18" font-weight="700" fill="#991B1B" text-anchor="middle">Risques</text><text x="1000" y="248" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="middle">fuite, réutilisation,</text><text x="1000" y="270" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="middle">non-conformité RGPD</text><path d="M735 235 L855 235" stroke="#FCA5A5" stroke-width="2.5" stroke-dasharray="6 6"/><path d="M844.2 240.2 L855 235 L844.2 229.8" fill="none" stroke="#FCA5A5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="400" font-size="20" font-weight="700" fill="#16A34A" text-anchor="start">IA privée (hébergée chez vous)</text><rect x="60" y="430" width="220" height="150" rx="14" fill="#fff" stroke="#E5E5E2" stroke-width="1.5"/><g transform="translate(145 455) scale(1.3333333333333333)" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></g><text x="170" y="530" font-size="18" font-weight="600" fill="#333" text-anchor="middle">Collaborateur</text><text x="170" y="555" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="middle">pose une question</text><rect x="360" y="410" width="560" height="190" rx="18" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2" stroke-dasharray="8 6"/><text x="380" y="432" font-size="14" font-weight="600" fill="#15803D" text-anchor="start">Votre périmètre (serveur interne ou cloud européen)</text><rect x="400" y="450" width="220" height="130" rx="14" fill="#fff" stroke="#86EFAC" stroke-width="1.5"/><g transform="translate(490 465) scale(1.4166666666666667)" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></g><text x="510" y="535" font-size="18" font-weight="700" fill="#14532D" text-anchor="middle">Modèle IA privé</text><text x="510" y="558" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="middle">open source</text><rect x="680" y="450" width="220" height="130" rx="14" fill="#fff" stroke="#86EFAC" stroke-width="1.5"/><g transform="translate(770 465) scale(1.4166666666666667)" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></g><text x="790" y="535" font-size="18" font-weight="700" fill="#14532D" text-anchor="middle">Vos documents</text><text x="790" y="558" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="middle">indexés (RAG)</text><path d="M285 505 L395 505" stroke="#16A34A" stroke-width="2.5"/><path d="M384.2 510.2 L395 505 L384.2 499.8" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M622 515 L676 515" stroke="#16A34A" stroke-width="2.5"/><path d="M665.2 520.2 L676 515 L665.2 509.8" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="960" y="450" width="200" height="130" rx="14" fill="#fff" stroke="#86EFAC" stroke-width="1.5"/><text x="1060" y="495" font-size="17" font-weight="700" fill="#14532D" text-anchor="middle">Réponse sourcée</text><text x="1060" y="522" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="middle">aucune donnée</text><text x="1060" y="544" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="middle">ne sort</text><path d="M922 515 L956 515" stroke="#16A34A" stroke-width="2.5"/><path d="M945.2 520.2 L956 515 L945.2 509.8" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
